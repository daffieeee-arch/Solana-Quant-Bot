name: Dependency audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dependency-audit.yml
      - lab/security/**
      - lab/extractor/Cargo.lock
      - lab/extractor/Cargo.toml
      - lab/recorder/Cargo.lock
      - lab/recorder/Cargo.toml
      - lab/requirements-lab.txt
      - lab/ui/web/package.json
      - lab/ui/web/package-lock.json
      - package.json
      - package-lock.json
      - rust/*/Cargo.lock
      - rust/*/Cargo.toml
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

# Owner-approved 2026-10-12; covers lab/ and the frozen V2 lockfiles. High and critical advisories (and RustSec/PyPI advisories without a usable
# severity) fail; known exceptions live in lab/security/audit-ignore.toml with reason and dates.
jobs:
  cargo:
    name: dependency-audit (cargo)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit lab and frozen V2 Rust lockfiles against RustSec
        run: python3 lab/security/dependency_audit.py cargo lab/extractor/Cargo.lock lab/recorder/Cargo.lock rust/of1-range-recorder/Cargo.lock rust/of1-bronze-decoder/Cargo.lock rust/of1-parquet-projection/Cargo.lock rust/old-faithful-pump-reducer/Cargo.lock rust/pump-protocol-v2/Cargo.lock
  pip:
    name: dependency-audit (pip)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the audit script
        run: python3 lab/security/tests/test_dependency_audit.py
      - name: Install pip-audit
        run: python3 -m venv "$RUNNER_TEMP/pip-audit" && "$RUNNER_TEMP/pip-audit/bin/pip" install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit the lab Python toolchain
        run: python3 lab/security/dependency_audit.py pip lab/requirements-lab.txt --tool "$RUNNER_TEMP/pip-audit/bin/pip-audit"
  npm:
    name: dependency-audit (npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Audit lab/ui/web production dependencies
        run: python3 lab/security/dependency_audit.py npm lab/ui/web
      - name: Audit root (V2) dependencies including dev tooling
        run: python3 lab/security/dependency_audit.py npm . --include-dev
