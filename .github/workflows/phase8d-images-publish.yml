name: Phase 8D images publish

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit SHA to rebuild and publish
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_SYNTHETIC_PHASE8D_IMAGES exactly
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase8d-images-publish
  cancel-in-progress: false

jobs:
  normal-ci-gate:
    name: normal-ci-on-source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  image-verify-gate:
    name: image-verify-on-source
    uses: ./.github/workflows/phase8d-images-verify.yml
    permissions:
      contents: read
  publish:
    name: manual-private-ghcr-publish
    needs: [normal-ci-gate, image-verify-gate]
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_SYNTHETIC_PHASE8D_IMAGES' && inputs.source_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on source, branch, confirmation and live main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = PUBLISH_SYNTHETIC_PHASE8D_IMAGES
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          LIVE_MAIN_SHA="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$SOURCE_SHA" = "$LIVE_MAIN_SHA"
      - name: Set up exact Node runtime for publish policy
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Install locked publish policy dependencies
        run: npm ci
      - name: Enforce publish-job supply-chain policy
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(node --version)" = v22.23.2
          node scripts/phase8d1/assert-phase8d1-supply-chain.mjs
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Set up isolated Buildx
        id: buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.12.1
          driver: docker-container
          install: true
          driver-opts: |
            image=moby/buildkit@sha256:040d34121c27906c4ff9ac152a30d52bf2c5d328d3bb748916bb3d2743c02528
          platforms: linux/amd64
          buildkitd-flags: --debug --oci-worker-net bridge
      - name: Verify exact sandboxed BuildKit server
        env:
          BUILDX_NODES: ${{ steps.buildx.outputs.nodes }}
        run: |
          test "$(docker buildx version)" = "github.com/docker/buildx v0.12.1 30feaa1a915b869ebc2eea6328624b49facd4bfb"
          jq -e --arg image 'image=moby/buildkit@sha256:040d34121c27906c4ff9ac152a30d52bf2c5d328d3bb748916bb3d2743c02528' '
            length == 1 and
            .[0].buildkit == "v0.32.2" and
            (.[0].platforms | split(",") | index("linux/amd64") != null) and
            (.[0]["driver-opts"] | index($image) != null) and
            .[0]["buildkitd-flags"] == "--debug --oci-worker-net bridge" and
            (.[0]["buildkitd-flags"] | contains("security.insecure") | not) and
            (.[0]["buildkitd-flags"] | contains("network.host") | not) and
            .[0].labels["org.mobyproject.buildkit.worker.network"] == "cni"
          ' <<< "$BUILDX_NODES" >/dev/null
      - name: Resolve exact base digests
        id: bases
        run: node scripts/phase8d1/resolve-base-images.mjs resolve phase8d1-release-evidence/base-images.json
      - name: Prebuild exact hashes
        id: hashes
        run: scripts/phase8d1/prebuild-hashes.sh phase8d1-release-evidence/base-images.json phase8d1-release-evidence/prebuild-hashes.json
      - name: Build cockpit local pre-publish candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: containers/Dockerfile.cockpit
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: local/phase8a-research-cockpit:${{ steps.hashes.outputs.source_sha }}-${{ steps.hashes.outputs.cockpit_entrypoint_short }}-${{ steps.hashes.outputs.frontend_build_short }}
          build-args: |
            NODE_BUILDER_IMAGE=${{ steps.bases.outputs.node_builder_ref }}
            NODE_RUNTIME_IMAGE=${{ steps.bases.outputs.node_runtime_ref }}
            SOURCE_GIT_SHA=${{ steps.hashes.outputs.source_sha }}
            PACKAGE_LOCK_SHA256=${{ steps.hashes.outputs.package_lock_sha }}
            COCKPIT_ENTRYPOINT_SHA256=${{ steps.hashes.outputs.cockpit_entrypoint_sha }}
            COCKPIT_RUNTIME_TREE_SHA256=${{ steps.hashes.outputs.cockpit_runtime_tree_sha }}
            FRONTEND_BUILD_SHA256=${{ steps.hashes.outputs.frontend_build_sha }}
            COCKPIT_UID=${{ steps.hashes.outputs.cockpit_uid }}
            COCKPIT_GID=${{ steps.hashes.outputs.shared_gid }}
      - name: Build runner local pre-publish candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: containers/Dockerfile.phase8a-runner
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: local/phase8a-bronze-runner:${{ steps.hashes.outputs.source_sha }}-${{ steps.hashes.outputs.runner_binary_short }}
          build-args: |
            RUST_BUILDER_IMAGE=${{ steps.bases.outputs.rust_ref }}
            RUNNER_RUNTIME_IMAGE=${{ steps.bases.outputs.runtime_ref }}
            SOURCE_GIT_SHA=${{ steps.hashes.outputs.source_sha }}
            RUNNER_BINARY_SHA256=${{ steps.hashes.outputs.runner_binary_sha }}
            CARGO_LOCK_SHA256=${{ steps.hashes.outputs.cargo_lock_sha }}
            RUNNER_UID=${{ steps.hashes.outputs.runner_uid }}
            RUNNER_GID=${{ steps.hashes.outputs.shared_gid }}
      - name: Retest local candidates before any push
        env:
          COCKPIT_IMAGE: local/phase8a-research-cockpit:${{ steps.hashes.outputs.source_sha }}-${{ steps.hashes.outputs.cockpit_entrypoint_short }}-${{ steps.hashes.outputs.frontend_build_short }}
          RUNNER_IMAGE: local/phase8a-bronze-runner:${{ steps.hashes.outputs.source_sha }}-${{ steps.hashes.outputs.runner_binary_short }}
          BASE_MANIFEST: phase8d1-release-evidence/base-images.json
          PREBUILD_MANIFEST: phase8d1-release-evidence/prebuild-hashes.json
          EVIDENCE_DIR: phase8d1-release-evidence/pre-push
          PUBLISH_MODE: verify
        run: scripts/phase8d1/verify-images.sh
      - name: Log in to private GHCR with repository token only
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute unique private package tags
        id: tags
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "cockpit=ghcr.io/$owner/phase8a-research-cockpit:${{ steps.hashes.outputs.source_sha }}-${{ steps.hashes.outputs.cockpit_entrypoint_short }}-${{ steps.hashes.outputs.frontend_build_short }}" >> "$GITHUB_OUTPUT"
          echo "runner=ghcr.io/$owner/phase8a-bronze-runner:${{ steps.hashes.outputs.source_sha }}-${{ steps.hashes.outputs.runner_binary_short }}" >> "$GITHUB_OUTPUT"
      - name: Inspect tag absence and initialize durable publish state
        id: preflight-gate
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          COCKPIT_TAG: ${{ steps.tags.outputs.cockpit }}
          RUNNER_TAG: ${{ steps.tags.outputs.runner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARTIAL_PUBLISH_OBSERVATION: phase8d1-release-evidence/publish-observation.json
          PARTIAL_PUBLISH_STATE: phase8d1-release-evidence/publish-state.json
        run: scripts/phase8d1/publish-gates.sh
      - name: Upload preflight publish state
        if: always() && hashFiles('phase8d1-release-evidence/publish-state.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase8d1-publish-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase8d1-release-evidence/publish-state.json
          if-no-files-found: error
          retention-days: 30
      - name: Stop before push when preflight is not ready
        if: always()
        run: |
          test "${{ steps.preflight-gate.outcome }}" = success
          jq -e '.verdict=="PRE_PUSH_READY" and .deploymentEligible==false' phase8d1-release-evidence/publish-state.json >/dev/null
      - name: Push cockpit with BuildKit provenance and SPDX SBOM
        id: push-cockpit
        continue-on-error: true
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: containers/Dockerfile.cockpit
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.cockpit }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NODE_BUILDER_IMAGE=${{ steps.bases.outputs.node_builder_ref }}
            NODE_RUNTIME_IMAGE=${{ steps.bases.outputs.node_runtime_ref }}
            SOURCE_GIT_SHA=${{ steps.hashes.outputs.source_sha }}
            PACKAGE_LOCK_SHA256=${{ steps.hashes.outputs.package_lock_sha }}
            COCKPIT_ENTRYPOINT_SHA256=${{ steps.hashes.outputs.cockpit_entrypoint_sha }}
            COCKPIT_RUNTIME_TREE_SHA256=${{ steps.hashes.outputs.cockpit_runtime_tree_sha }}
            FRONTEND_BUILD_SHA256=${{ steps.hashes.outputs.frontend_build_sha }}
            COCKPIT_UID=${{ steps.hashes.outputs.cockpit_uid }}
            COCKPIT_GID=${{ steps.hashes.outputs.shared_gid }}
      - name: Record cockpit push state
        if: always() && steps.preflight-gate.outcome == 'success'
        env:
          PUSH_OUTCOME: ${{ steps.push-cockpit.outcome }}
          PUSH_DIGEST: ${{ steps.push-cockpit.outputs.digest }}
        run: node scripts/phase8d1/partial-publish-state.mjs record phase8d1-release-evidence/publish-state.json cockpit "$PUSH_OUTCOME" "$PUSH_DIGEST"
      - name: Upload cockpit push state
        if: always() && steps.preflight-gate.outcome == 'success' && hashFiles('phase8d1-release-evidence/publish-state.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase8d1-publish-cockpit-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase8d1-release-evidence/publish-state.json
          if-no-files-found: error
          retention-days: 30
      - name: Push runner with BuildKit provenance and SPDX SBOM
        id: push-runner
        if: always() && steps.preflight-gate.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: containers/Dockerfile.phase8a-runner
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.runner }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            RUST_BUILDER_IMAGE=${{ steps.bases.outputs.rust_ref }}
            RUNNER_RUNTIME_IMAGE=${{ steps.bases.outputs.runtime_ref }}
            SOURCE_GIT_SHA=${{ steps.hashes.outputs.source_sha }}
            RUNNER_BINARY_SHA256=${{ steps.hashes.outputs.runner_binary_sha }}
            CARGO_LOCK_SHA256=${{ steps.hashes.outputs.cargo_lock_sha }}
            RUNNER_UID=${{ steps.hashes.outputs.runner_uid }}
            RUNNER_GID=${{ steps.hashes.outputs.shared_gid }}
      - name: Record runner push state
        if: always() && steps.preflight-gate.outcome == 'success'
        env:
          PUSH_OUTCOME: ${{ steps.push-runner.outcome }}
          PUSH_DIGEST: ${{ steps.push-runner.outputs.digest }}
        run: node scripts/phase8d1/partial-publish-state.mjs record phase8d1-release-evidence/publish-state.json runner "$PUSH_OUTCOME" "$PUSH_DIGEST"
      - name: Upload runner push state
        if: always() && steps.preflight-gate.outcome == 'success' && hashFiles('phase8d1-release-evidence/publish-state.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase8d1-publish-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase8d1-release-evidence/publish-state.json
          if-no-files-found: error
          retention-days: 30
      - name: Pull and retest immutable registry digests
        id: digest-retest
        if: always() && steps.push-cockpit.outcome == 'success' && steps.push-runner.outcome == 'success'
        continue-on-error: true
        env:
          COCKPIT_REF: ${{ steps.tags.outputs.cockpit }}@${{ steps.push-cockpit.outputs.digest }}
          RUNNER_REF: ${{ steps.tags.outputs.runner }}@${{ steps.push-runner.outputs.digest }}
          COCKPIT_DIGEST: ${{ steps.push-cockpit.outputs.digest }}
          RUNNER_DIGEST: ${{ steps.push-runner.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVIDENCE_DIR: phase8d1-release-evidence/final
          BASE_MANIFEST: phase8d1-release-evidence/base-images.json
          PREBUILD_MANIFEST: phase8d1-release-evidence/prebuild-hashes.json
        run: scripts/phase8d1/verify-published-images.sh
      - name: Re-resolve bases and reject digest drift
        id: base-drift
        if: always() && steps.push-cockpit.outcome == 'success' && steps.push-runner.outcome == 'success'
        continue-on-error: true
        run: node scripts/phase8d1/resolve-base-images.mjs compare phase8d1-release-evidence/base-images.json
      - name: Verify tracked tree is unchanged
        id: clean-tree
        if: always() && steps.preflight-gate.outcome == 'success'
        continue-on-error: true
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - name: Finalize durable publish state
        if: always() && steps.preflight-gate.outcome == 'success'
        env:
          RETEST_OUTCOME: ${{ steps.digest-retest.outcome }}
          DRIFT_OUTCOME: ${{ steps.base-drift.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean-tree.outcome }}
        run: |
          if [[ "$RETEST_OUTCOME" == success && "$DRIFT_OUTCOME" == success && "$CLEAN_OUTCOME" == success ]]; then
            node scripts/phase8d1/partial-publish-state.mjs mark-verified phase8d1-release-evidence/publish-state.json
          fi
      - name: Upload final publish state
        if: always() && steps.preflight-gate.outcome == 'success' && hashFiles('phase8d1-release-evidence/publish-state.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase8d1-publish-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phase8d1-release-evidence/publish-state.json
            phase8d1-release-evidence/final/*.json
            phase8d1-release-evidence/final/*.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: false
      - name: Require complete publish success
        if: always()
        run: |
          test "${{ steps.preflight-gate.outcome }}" = success
          node scripts/phase8d1/partial-publish-state.mjs require-success phase8d1-release-evidence/publish-state.json
