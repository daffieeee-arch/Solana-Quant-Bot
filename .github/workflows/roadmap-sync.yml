name: Roadmap sync

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: roadmap-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: projects-v2-reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Even manual dispatch always checks out trusted default-branch code.
      # Never execute PR-head code with PROJECT_TOKEN.
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Validate roadmap configuration without network access
        run: node scripts/github-projects/sync.mjs --dry-run
      - name: Reconcile user-owned GitHub Project
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/github-projects/sync.mjs
