name: Roadmap sync

on:
  workflow_dispatch: {}
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - milestoned
      - demilestoned
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - closed
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: roadmap-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: projects-v2-reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # pull_request_target is used only to observe PR state. The workflow always
      # checks out the trusted default branch and never executes PR-head code.
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Validate roadmap configuration without network access
        run: node scripts/github-projects/sync.mjs --dry-run
      - name: Reconcile user-owned GitHub Project
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/github-projects/sync.mjs
