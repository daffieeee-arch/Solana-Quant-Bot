[package]
name = "lab-extractor"
version = "0.1.0"
edition = "2021"
publish = false
description = "Streams pump.fun and PumpSwap events from Old Faithful via Jetstreamer into Parquet"

[dependencies]
jetstreamer-firehose = "=0.7.0"
jetstreamer-plugin = "=0.7.0"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "60"
arrow-schema = "60"
sha2 = "0.10"
bs58 = "0.5"
log = "0.4"
env_logger = "0.11"
serde_json = "1"
hex = "0.4"
clickhouse = "0.15"

[profile.release]
debug = 0
