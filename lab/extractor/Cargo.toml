[package]
name = "lab-extractor"
version = "0.1.0"
edition = "2021"
publish = false
description = "Streams pump.fun and PumpSwap events from Old Faithful via Jetstreamer into Parquet"

[dependencies]
# Jetstreamer main after 0.7.0: Agave 4.2 crates (v1 "0x81" transactions, DeactivatedStake rewards)
# and the fix for dropped block callbacks after work stealing (#102). 0.7.0 cannot read Sept 2026+ epochs.
jetstreamer-firehose = { git = "https://github.com/anza-xyz/jetstreamer", rev = "1f9d30600fb479acdd5eb956ea2e19455c903590" }
jetstreamer-plugin = { git = "https://github.com/anza-xyz/jetstreamer", rev = "1f9d30600fb479acdd5eb956ea2e19455c903590" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "60"
arrow-schema = "60"
sha2 = "0.10"
bs58 = "0.5"
log = "0.4"
solana-message = "4"
env_logger = "0.11"
serde_json = "1"
hex = "0.4"
clickhouse = "0.15"

[profile.release]
debug = 0
