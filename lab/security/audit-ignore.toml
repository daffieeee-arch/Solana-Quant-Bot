[[ignore]]
id = "RUSTSEC-2024-0421"
ecosystem = "cargo"
package = "idna"
reason = "Agave-pinned idna 0.1.5; Punycode confusion only matters for hostname checks on untrusted input, which we do not do. GHSA-h97m-ww89-6jmq."
