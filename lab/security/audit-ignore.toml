ecosystem = "cargo"
package = "idna"
version = "0.1.5"
reason = "idna 0.1.5 comes through url 1.7.2 in jsonrpc-client-transports 18.0.0, the last release of an unmaintained crate. GHSA-h97m-ww89-6jmq."
