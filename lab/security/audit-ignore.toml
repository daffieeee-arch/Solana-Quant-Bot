# Known advisories that dependency_audit.py reports but does not fail on.
#
# Rule (owner, 2026-10-12): fix first. An entry is only allowed when no patched version exists that is
# compatible with the parent's version requirement; `evidence` shows that (the advisory's patched range
# plus the parent's requirement, from crates.io / PyPI / npm and the advisory), and the owner decides.
#
# Every entry needs: id (the advisory id or one of its aliases), ecosystem (cargo, pip or npm), package,
# reason (why it cannot be fixed), risk (the risk for our use: do we sign, is the affected code called),
# evidence, approved (YYYY-MM-DD), approved_by and review_by (YYYY-MM-DD). Optional: version, so the
# entry covers only that exact version (another, still affected version fails again). After review_by
# the entry stops applying and the check fails again until someone re-decides. Ignored findings are
# always printed with their reason and risk; an entry that no longer matches anything is printed as stale.

# Six temporary exceptions in the Agave 4.2 tree that lab/extractor and lab/recorder get through
# Jetstreamer. The owner approved them on 2026-10-12 ("Ja, ik ben akkoord met deze zes tijdelijke
# uitzonderingen"), with evidence from Lab Backtest (#193) and LAB review, re-checked on crates.io.
# Re-review at every Agave or Jetstreamer upgrade, and by review_by at the latest.

[[ignore]]
id = "RUSTSEC-2022-0093"
ecosystem = "cargo"
package = "ed25519-dalek"
version = "1.0.1"
reason = "Agave pins ed25519-dalek 1.0.1 exactly; the patched 2.x is not allowed by the parent. GHSA-w5vr-6qhr-36cc."
risk = "None: the signing oracle needs signing with an attacker-chosen public key. We hold no keys and never sign (paper only)."
evidence = "Patched >= 2.0.0. agave-precompiles requires ed25519-dalek =1.0.1 in every 4.x release (4.2.2 in the lock, newest 4.3.0); solana-runtime 4.2.2 pins agave-precompiles =4.2.2. 1.0.1 is the last 1.x."
approved = "2026-10-12"
approved_by = "owner (fix-first rule, decision via coordinator)"
review_by = "2026-11-12"

[[ignore]]
id = "RUSTSEC-2024-0344"
ecosystem = "cargo"
package = "curve25519-dalek"
version = "3.2.0"
reason = "Only through ed25519-dalek 1.0.1 (above), which requires curve25519-dalek ^3; every 3.x is affected. GHSA-x4gp-pqpj-f43q."
risk = "None: a timing side channel on secret scalars, and we hold no secret keys."
evidence = "Patched >= 4.1.3. ed25519-dalek 1.0.1 requires ^3; the last 3.x (3.2.1) is still affected. The patched 4.1.3 is already in the lock through other parents."
approved = "2026-10-12"
approved_by = "owner (fix-first rule, decision via coordinator)"
review_by = "2026-11-12"

[[ignore]]
