[[ignore]]
id = "RUSTSEC-2026-0292"
ecosystem = "cargo"
package = "imbl-sized-chunks"
reason = "Via solana-runtime 4.2.2 -> imbl 7.0.1 (Jetstreamer's Agave 4.2 pin); double drop only if an element's Drop panics inside Chunk::clear/drop_*; fix (0.2.0) needs an Agave upgrade; the binaries only process OF1/Triton data, no signing or keys. No GHSA alias."
approved = "2026-10-12"
