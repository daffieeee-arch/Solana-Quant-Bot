license = "Apache-2.0"
description = "Transport-free vendored Jetstreamer v0.7.0 callback type snapshot"

[package.metadata.upstream]
repository = "https://github.com/anza-xyz/jetstreamer.git"
tag = "jetstreamer-firehose@v0.7.0"
