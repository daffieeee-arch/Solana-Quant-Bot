[package]
name = "of1-bronze-decoder"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"
description = "Bounded offline receipt-bound Solana Raw to Bronze JSON decoder"

[dependencies]
of1-range-recorder = { path = "../of1-range-recorder", default-features = false }
pump-protocol-v2 = { path = "../pump-protocol-v2", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_cbor = { version = "=0.11.2", features = ["tags"] }
hex = "=0.4.3"
bs58 = "=0.5.1"
bincode = "=1.3.3"
prost = "=0.11.9"
crc = "=3.4.0"
fnv = { version = "=1.0.7", default-features = false }
zstd = { version = "=0.13.3", default-features = false }
solana-transaction = { version = "=3.0.2", default-features = false, features = ["serde"] }
solana-message = { version = "=3.0.1", default-features = false, features = ["serde"] }
solana-pubkey = { version = "=4.3.0", default-features = false, features = ["curve25519"] }
solana-transaction-error = { version = "=3.2.0", default-features = false, features = ["serde"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
