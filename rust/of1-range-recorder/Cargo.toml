[package]
name = "of1-range-recorder"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[features]
default = []
monitor = []
loopback-fixture = []
network-of1 = ["dep:rustls", "dep:webpki-roots"]
tls-fixture = ["dep:rustls", "dep:rcgen"]

[[bin]]
name = "of1-bronze-evidence"
path = "src/bin/of1-bronze-evidence.rs"
required-features = ["monitor"]

[[bin]]
name = "of1-monitor"
path = "src/bin/of1-monitor.rs"
required-features = ["monitor"]

[[bin]]
name = "of1-monitor-simulation"
path = "src/bin/of1-monitor-simulation.rs"
required-features = ["monitor", "tls-fixture"]

[[bin]]
name = "of1-transport-evidence"
path = "src/bin/of1-transport-evidence.rs"
required-features = ["loopback-fixture"]

[[bin]]
name = "of1-acquisition-fixture-evidence"
path = "src/bin/of1-acquisition-fixture-evidence.rs"
required-features = ["tls-fixture"]

[dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
rustls = { version = "=0.23.43", optional = true, default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = { version = "=1.0.9", optional = true, default-features = false }
rcgen = { version = "=0.14.10", optional = true, default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
