[package]
name = "pump-protocol-v2"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pump-protocol-evidence"
path = "src/bin/pump-protocol-evidence.rs"

[dependencies]
borsh = { version = "=1.8.0", features = ["derive"] }
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
